services:
  - type: web
    name: grovio-api
    runtime: node
    rootDir: backend
    build:
      command: npm ci
    start:
      command: npm start
    healthCheck:
      path: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        value: https://your-grovio.vercel.app
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 7
      - key: REFRESH_TOKEN_TTL_DAYS_REMEMBERED
        value: 30
      - key: RESET_TOKEN_TTL_MINUTES
        value: 30
      - key: EXPOSE_DEV_RESET_TOKEN
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
